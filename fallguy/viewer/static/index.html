<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FALLGUY Viewer</title>
<style>
  :root {
    --bg: #0f1114; --panel: #171a1f; --line: #2a2f37; --text: #e6e8eb; --dim: #8b929c;
    --accent: #ff8a3d; --v1: #6aa7ff; --v2: #ff8a3d; --ok: #3ccf7a; --warn: #f2b632; --bad: #ff4d4d;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: 44px 1fr 56px; height: 100vh; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 14px; padding: 0 14px;
    border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
  header .logo { font-weight: 800; letter-spacing: .12em; color: var(--accent); }
  header .brief { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .dim { color: var(--dim); white-space: nowrap; }
  #stage { position: relative; overflow: hidden; background: #000; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .backdrop { position: absolute; pointer-events: none; object-fit: fill; opacity: 0; }
  .vplabel { position: absolute; z-index: 3; padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 12px;
    background: rgba(0,0,0,.6); pointer-events: none; }
  .hud { position: absolute; z-index: 3; left: 10px; bottom: 8px; color: var(--dim); font-size: 11px; pointer-events: none; }
  aside { overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 10px 12px 30px; }
  aside h3 { margin: 14px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
  button, .seg label { background: #222730; color: var(--text); border: 1px solid var(--line); border-radius: 5px;
    padding: 4px 9px; font: inherit; cursor: pointer; }
  button.on, .seg input:checked + span { background: var(--accent); color: #111; border-color: var(--accent); }
  .seg { display: inline-flex; }
  .seg label { padding: 0; border-radius: 0; overflow: hidden; }
  .seg label:first-child { border-radius: 5px 0 0 5px; } .seg label:last-child { border-radius: 0 5px 5px 0; }
  .seg input { display: none; } .seg span { display: inline-block; padding: 4px 9px; }
  label.chk { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  input[type=range] { accent-color: var(--accent); }
  canvas.chart { width: 100%; height: 110px; display: block; background: #12151a; border: 1px solid var(--line);
    border-radius: 6px; margin-bottom: 6px; cursor: crosshair; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { padding: 3px 4px; border-bottom: 1px solid var(--line); text-align: right; }
  td:first-child, th:first-child { text-align: left; color: var(--dim); }
  .tabs { display: flex; gap: 4px; margin-bottom: 6px; }
  .critique { background: #12151a; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .critique p { margin: 0 0 6px; } .critique ul { margin: 4px 0 6px 16px; padding: 0; }
  .critique .score { font-size: 22px; font-weight: 800; }
  .critique pre { white-space: pre-wrap; font-size: 11px; color: var(--dim); margin: 0; }
  .legend { display: flex; gap: 10px; font-size: 11px; color: var(--dim); }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  footer { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; padding: 0 14px;
    border-top: 1px solid var(--line); background: var(--panel); }
  footer input[type=range] { flex: 1; }
  #time { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; color: var(--dim); }
  #status { position: absolute; z-index: 4; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.7);
    padding: 6px 12px; border-radius: 6px; font-size: 12px; pointer-events: none; }
  .objs { font-size: 12px; color: var(--dim); }
  .objs b { color: var(--text); font-weight: 600; }
  video { width: 100%; border-radius: 6px; background: #000; }
  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 44px 60vh auto 56px; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    header, footer { grid-column: 1; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "/static/vendor/three.module.js", "three/addons/": "/static/vendor/addons/" } }
</script>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">FALLGUY</span>
    <span class="brief" id="brief">loading...</span>
    <span class="dim" id="worldname"></span>
  </header>
  <div id="stage">
    <canvas id="gl"></canvas>
    <img id="bd0" class="backdrop" alt="">
    <img id="bd1" class="backdrop" alt="">
    <div id="lbl0" class="vplabel" hidden></div>
    <div id="lbl1" class="vplabel" hidden></div>
    <div class="hud" id="hud"></div>
    <div id="status">loading world...</div>
  </div>
  <aside>
    <h3>View</h3>
    <div class="row">
      <span class="seg">
        <label><input type="radio" name="view" value="ref" checked><span>Reference camera</span></label>
        <label><input type="radio" name="view" value="orbit"><span>Free orbit</span></label>
      </span>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="tMesh" checked> world mesh</label>
      <label class="chk"><input type="checkbox" id="tColl" checked> collision boxes</label>
      <label class="chk"><input type="checkbox" id="tUnlit" checked> unlit texture</label>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="tStress" checked> stress colours</label>
      <label class="chk"><input type="checkbox" id="tSplit" checked> v1 | v2 side by side</label>
      <label class="chk"><input type="checkbox" id="tFollow"> follow performer</label>
      <label class="chk" title="reference view: hide the reconstruction and composite the H1 over the real video frame"><input type="checkbox" id="tPlate"> H1 over real frame</label>
    </div>
    <div class="row">ref frame backdrop <input type="range" id="bdOp" min="0" max="1" step="0.05" value="0"> <span id="bdOpV" class="dim">0%</span></div>
    <div class="row" id="takeRow"></div>

    <div id="stuntPanel" hidden>
      <h3>Timeline</h3>
      <div class="legend" id="legend"></div>
      <canvas class="chart" id="chartG"></canvas>
      <canvas class="chart" id="chartK"></canvas>
      <div class="legend"><span><span class="sw" style="background:var(--ok)"></span>&lt; 0.5 of limit</span>
        <span><span class="sw" style="background:var(--warn)"></span>&lt; 1</span>
        <span><span class="sw" style="background:var(--bad)"></span>&ge; 1 (over limit)</span></div>
      <h3>Peaks and stress</h3>
      <table id="peaks"></table>
      <h3>Argon critique</h3>
      <div class="tabs" id="critTabs"></div>
      <div class="critique" id="crit">-</div>
      <div id="videoBox" hidden><h3>Render</h3><video id="video" controls muted playsinline></video></div>
    </div>
    <h3>World</h3>
    <div class="objs" id="worldInfo">-</div>
  </aside>
  <footer>
    <button id="play">Play</button>
    <input type="range" id="scrub" min="0" max="1" step="0.001" value="0">
    <span id="time">0.00 / 0.00 s</span>
    <select id="speed"><option value="1">1x</option><option value="0.5">0.5x</option><option value="0.25">0.25x</option><option value="2">2x</option></select>
  </footer>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
